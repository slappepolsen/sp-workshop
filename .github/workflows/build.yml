name: Build Executables And Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch or tag to build (e.g. main or v10.4.0-alpha.11)"
        required: true
        default: main
        type: string
      create_github_release:
        description: "Create GitHub Release (macOS DMGs, Windows x64+ARM64 zips, Linux x64 tar.gz)"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Tag for the release (must already exist on GitHub). Required when create_github_release is true — usually same as ref when releasing a tag."
        required: false
        default: ""
        type: string

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if release requested without tag
        if: ${{ inputs.create_github_release == true && inputs.release_tag == '' }}
        run: |
          echo "::error::When create_github_release is true, release_tag must be set (e.g. v10.4.0-alpha.11)"
          exit 1

  build-macos:
    needs: validate-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            mac_suffix: arm64
            mac_name: "Apple Silicon (arm64)"
          - runner: macos-15-intel
            mac_suffix: intel
            mac_name: "Intel (x64)"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Runner architecture
        run: uname -m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app (${{ matrix.mac_name }})
        run: |
          pyinstaller --windowed --name "SP_Workshop" --icon=media/icon.icns app.py

      - name: Smoke test macOS executable (${{ matrix.mac_suffix }})
        run: |
          APP_BIN="dist/SP_Workshop.app/Contents/MacOS/SP_Workshop"
          if [ ! -x "$APP_BIN" ]; then
            echo "Missing macOS executable: $APP_BIN"
            exit 1
          fi
          python - <<'PY'
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          env["QT_QPA_PLATFORM"] = "offscreen"

          proc = subprocess.Popen(
              ["dist/SP_Workshop.app/Contents/MacOS/SP_Workshop"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              env=env,
          )
          try:
              proc.wait(timeout=20)
              output = proc.stdout.read() if proc.stdout else ""
              print("macOS smoke test failed: process exited early.")
              if output:
                  print(output)
              sys.exit(1)
          except subprocess.TimeoutExpired:
              proc.terminate()
              sys.exit(0)
          PY

      - name: Create macOS DMG (${{ matrix.mac_suffix }})
        id: mac_dmg
        run: |
          case "${{ matrix.mac_suffix }}" in
            arm64) DMG_NAME="SP_Workshop-macOS-ARM64.dmg" ;;
            intel) DMG_NAME="SP_Workshop-macOS-x64.dmg" ;;
            *) echo "unknown mac_suffix"; exit 1 ;;
          esac
          echo "dmg=$DMG_NAME" >> "$GITHUB_OUTPUT"
          STAGE=$(mktemp -d)
          cp -R dist/SP_Workshop.app "$STAGE/"
          hdiutil create -volname "SP Workshop" -srcfolder "$STAGE" -ov -format UDZO -fs HFS+ "$DMG_NAME"
          rm -rf "$STAGE"
          ls -la "$DMG_NAME"

      - name: Upload macOS DMG (${{ matrix.mac_suffix }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.mac_suffix }}
          path: ${{ steps.mac_dmg.outputs.dmg }}

  build-windows:
    needs: validate-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            win_suffix: x64
          - runner: windows-11-arm
            win_suffix: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable (${{ matrix.win_suffix }})
        run: |
          pyinstaller --onefile --windowed --name "SP_Workshop" --icon=media/icon.ico app.py

      - name: Smoke test Windows executable
        shell: powershell
        run: |
          $exe = Resolve-Path "dist/SP_Workshop.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "Windows smoke test failed: process exited early."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Package Windows portable folder
        shell: cmd
        run: |
          mkdir dist\SP_Workshop_Windows
          copy dist\SP_Workshop.exe dist\SP_Workshop_Windows\
          copy README.md dist\SP_Workshop_Windows\
          copy CHANGELOG.md dist\SP_Workshop_Windows\
          copy LICENSE dist\SP_Workshop_Windows\
          copy requirements.txt dist\SP_Workshop_Windows\
          copy media\icon.ico dist\SP_Workshop_Windows\
          copy media\icon.png dist\SP_Workshop_Windows\
          copy media\flowcharts.png dist\SP_Workshop_Windows\

      - name: Upload Windows portable (${{ matrix.win_suffix }})
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ matrix.win_suffix }}
          path: dist/SP_Workshop_Windows/

  build-linux:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --onefile --name "SP_Workshop" app.py

      - name: Smoke test Linux executable
        run: |
          if [ ! -x "dist/SP_Workshop" ]; then
            echo "Missing Linux executable dist/SP_Workshop"
            exit 1
          fi
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 ./dist/SP_Workshop >/tmp/spw_linux_smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Linux smoke test failed with code $code"
            cat /tmp/spw_linux_smoke.log || true
            exit 1
          fi

      - name: Package Linux artifact
        run: |
          mkdir -p dist/SP_Workshop_Linux
          cp dist/SP_Workshop dist/SP_Workshop_Linux/
          chmod +x dist/SP_Workshop_Linux/SP_Workshop
          cp README.md CHANGELOG.md LICENSE requirements.txt dist/SP_Workshop_Linux/
          cp media/icon.ico media/icon.png media/flowcharts.png dist/SP_Workshop_Linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/SP_Workshop_Linux/

  release:
    needs: [build-macos, build-windows, build-linux]
    if: ${{ inputs.create_github_release == true && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd artifacts
          (cd windows-portable-x64 && zip -r "$ROOT/SP_Workshop-Windows-x64.zip" .)
          (cd windows-portable-ARM64 && zip -r "$ROOT/SP_Workshop-Windows-ARM64.zip" .)
          cp macos-dmg-arm64/SP_Workshop-macOS-ARM64.dmg "$ROOT/"
          cp macos-dmg-intel/SP_Workshop-macOS-x64.dmg "$ROOT/"
          (cd linux-x64 && tar -czvf "$ROOT/SP_Workshop-Linux-x64.tar.gz" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            SP_Workshop-macOS-ARM64.dmg
            SP_Workshop-macOS-x64.dmg
            SP_Workshop-Windows-x64.zip
            SP_Workshop-Windows-ARM64.zip
            SP_Workshop-Linux-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.release_tag, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
