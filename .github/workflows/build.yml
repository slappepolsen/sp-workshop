name: Build Executables And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller --windowed --name "SP_Workshop" --icon=media/icon.icns app.py

      - name: Smoke test macOS executable
        run: |
          APP_BIN="dist/SP_Workshop.app/Contents/MacOS/SP_Workshop"
          if [ ! -x "$APP_BIN" ]; then
            echo "Missing macOS executable: $APP_BIN"
            exit 1
          fi
          python - <<'PY'
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          env["QT_QPA_PLATFORM"] = "offscreen"

          proc = subprocess.Popen(
              ["dist/SP_Workshop.app/Contents/MacOS/SP_Workshop"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              env=env,
          )
          try:
              proc.wait(timeout=20)
              output = proc.stdout.read() if proc.stdout else ""
              print("macOS smoke test failed: process exited early.")
              if output:
                  print(output)
              sys.exit(1)
          except subprocess.TimeoutExpired:
              proc.terminate()
              sys.exit(0)
          PY

      - name: Package macOS artifact
        run: |
          mkdir -p dist/SP_Workshop_macOS
          cp -R dist/SP_Workshop.app dist/SP_Workshop_macOS/
          cp README.md CHANGELOG.md LICENSE requirements.txt dist/SP_Workshop_macOS/
          cp media/icon.icns media/icon.ico media/icon.png media/flowcharts.png dist/SP_Workshop_macOS/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP_Workshop-macOS
          path: dist/SP_Workshop_macOS/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --windowed --name "SP_Workshop" --icon=media/icon.ico app.py

      - name: Smoke test Windows executable
        shell: powershell
        run: |
          $exe = Resolve-Path "dist/SP_Workshop.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "Windows smoke test failed: process exited early."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Package Windows artifact
        shell: cmd
        run: |
          mkdir dist\SP_Workshop_Windows
          copy dist\SP_Workshop.exe dist\SP_Workshop_Windows\
          copy README.md dist\SP_Workshop_Windows\
          copy CHANGELOG.md dist\SP_Workshop_Windows\
          copy LICENSE dist\SP_Workshop_Windows\
          copy requirements.txt dist\SP_Workshop_Windows\
          copy media\icon.ico dist\SP_Workshop_Windows\
          copy media\icon.png dist\SP_Workshop_Windows\
          copy media\flowcharts.png dist\SP_Workshop_Windows\

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP_Workshop-Windows
          path: dist/SP_Workshop_Windows/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --onefile --name "SP_Workshop" app.py

      - name: Smoke test Linux executable
        run: |
          if [ ! -x "dist/SP_Workshop" ]; then
            echo "Missing Linux executable dist/SP_Workshop"
            exit 1
          fi
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 ./dist/SP_Workshop >/tmp/spw_linux_smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Linux smoke test failed with code $code"
            cat /tmp/spw_linux_smoke.log || true
            exit 1
          fi

      - name: Package Linux artifact
        run: |
          mkdir -p dist/SP_Workshop_Linux
          cp dist/SP_Workshop dist/SP_Workshop_Linux/
          chmod +x dist/SP_Workshop_Linux/SP_Workshop
          cp README.md CHANGELOG.md LICENSE requirements.txt dist/SP_Workshop_Linux/
          cp media/icon.ico media/icon.png media/flowcharts.png dist/SP_Workshop_Linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP_Workshop-Linux
          path: dist/SP_Workshop_Linux/

  release:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          cd artifacts
          zip -r ../SP_Workshop-macOS.zip SP_Workshop-macOS/
          zip -r ../SP_Workshop-Windows.zip SP_Workshop-Windows/
          tar -czvf ../SP_Workshop-Linux.tar.gz SP_Workshop-Linux/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SP_Workshop-macOS.zip
            SP_Workshop-Windows.zip
            SP_Workshop-Linux.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
